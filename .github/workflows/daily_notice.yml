name: Daily Inha Notice

on:
  schedule:
    # 공지는 9~17시에 올라오니 새벽에 확인. GitHub 스케줄은 몇 시간씩 밀리기도 해서
    # (10:15 예약 → 15~16시 실행된 적 있음) 자정 넘어 일찍 걸어두면 아침 전에는 끝남.
    # 예약 실행을 가끔 통째로 빼먹기도 해서 세 번 걸어두고, 그날 확인을 마쳤으면 나머지는 건너뜀.
    # 매일 KST 00:37 / 03:37 / 06:37 (정각·15분 단위는 혼잡해서 피함)
    - cron: '37 15 * * *'
    - cron: '37 18 * * *'
    - cron: '37 21 * * *'
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'test = 중복 무시하고 테스트 발송(기록 안 남김) / normal = 정식 실행'
        type: choice
        options: [test, normal]
        default: test

# 스케줄끼리 겹쳐도 동시에 돌지 않게
concurrency:
  group: daily-notice
  cancel-in-progress: false

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v5

    - name: 파이썬 설정
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip

    - name: 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 파이썬 스크립트 실행
      env:
        EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        TO_EMAIL: ${{ secrets.TO_EMAIL }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        RUN_MODE: ${{ inputs.run_mode }}
      run: python notice_crawler.py

    - name: 변경사항(보낸 목록) 저장 및 커밋
      run: |
        git config --global user.name 'Notice Bot'
        git config --global user.email 'bot@noreply.github.com'
        for f in sent_notices.json state.json; do [ -f "$f" ] && git add "$f"; done
        # 변경사항이 있을 때만 커밋
        if git commit -m "Update sent notices list"; then
          git pull --rebase
          git push
        else
          echo "새로운 변경사항이 없습니다."
        fi
